name: TestFlight

# Archives a signed Release build and uploads it to App Store Connect / TestFlight.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character Team ID from developer.apple.com/account
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64    the .p8 key file, base64-encoded (base64 -i AuthKey_XXXX.p8 | pbcopy)
# Optional repository variable:
#   BUNDLE_ID            defaults to com.aquabunnyx3.idlehearts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.aquabunnyx3.idlehearts' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "::error::Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 secrets first (see RELEASE.md)."
            exit 1
          fi

      - name: Install API key
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project IdleHearts.xcodeproj -scheme IdleHearts -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/IdleHearts.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGN_STYLE=Automatic

      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp ExportOptions.plist build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/IdleHearts.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing (usually 5–30 min)."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
